{# app.html — included inside <script type="text/babel"> in each page template #}
{# NAV uses {% url %} tags so must stay outside verbatim. Everything else is protected. #}

{% verbatim %}
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "colorMode": "slate",
  "accentColor": "#50c9a5",
  "amberColor": "#f5c542"
}/*EDITMODE-END*/;

const THEMES = {
  slate: { bg:'#0d1117', surface:'#161b22', surfaceAlt:'#1f2937', border:'#30363d', text:'#e6edf3', textMuted:'#8b949e' },
  warm:  { bg:'#110e0c', surface:'#1c1916', surfaceAlt:'#261f1b', border:'#3a3028', text:'#f0e8df', textMuted:'#9a8a7e' },
};
{% endverbatim %}

const NAV = {
  calculator: '{% url "calculator:calculator" %}',
  datasets:   '{% url "calculator:datasets" %}',
  insights:   '{% url "calculator:insights" %}',
};

{% verbatim %}

function App() {
  const [tab, setTab]           = React.useState(window.__INITIAL_TAB__ || 'calculator');
  const [tweaks, setTweaks]     = React.useState(TWEAK_DEFAULTS);
  const [showTweaks, setShow]   = React.useState(false);

  const base  = THEMES[tweaks.colorMode] || THEMES.slate;
  const theme = { ...base, accent: tweaks.accentColor, accentDim: tweaks.accentColor + '20', amber: tweaks.amberColor };

  React.useEffect(() => {
    const h = (e) => {
      if (e.data?.type === '__activate_edit_mode')   setShow(true);
      if (e.data?.type === '__deactivate_edit_mode') setShow(false);
    };
    window.addEventListener('message', h);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  const setTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
    const m = THEMES[next.colorMode] || THEMES.slate;
    document.documentElement.style.setProperty('--bg',          m.bg);
    document.documentElement.style.setProperty('--surface',     m.surface);
    document.documentElement.style.setProperty('--surface-alt', m.surfaceAlt);
    document.documentElement.style.setProperty('--border',      m.border);
    document.documentElement.style.setProperty('--accent',      next.accentColor);
    document.documentElement.style.setProperty('--amber',       next.amberColor);
  };

  const tabs = [
    { id: 'calculator', label: 'Calculator' },
    { id: 'datasets',   label: 'Browse Data' },
    { id: 'insights',   label: 'Analysis & Insights' },
  ];

  return (
    <div style={{ minHeight:'100vh', background:theme.bg, display:'flex', flexDirection:'column' }}>
      <header style={{ borderBottom:`1px solid ${theme.border}`, background:theme.surface+'cc', backdropFilter:'blur(12px)', position:'sticky', top:0, zIndex:50 }}>
        <div style={{ maxWidth:1440, margin:'0 auto', padding:'0 24px', display:'flex', alignItems:'center', height:64, gap:32 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
            <div style={{ width:28, height:28, borderRadius:6, background:`${theme.accent}22`, border:`1px solid ${theme.accent}44`, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="5" stroke={theme.accent} strokeWidth="1.5"/>
                <path d="M5 7 Q7 4 9 7 Q7 10 5 7Z" fill={theme.accent} opacity="0.7"/>
              </svg>
            </div>
            <div>
              <div style={{ fontSize:'14px', fontWeight:700, color:theme.text, fontFamily:'Space Grotesk', letterSpacing:'0.02em', lineHeight:1.1 }}>Alchemy Analysis</div>
              <div style={{ fontSize:'10px', color:theme.textMuted, letterSpacing:'0.08em', textTransform:'uppercase' }}>ESV: Skyrim</div>
            </div>
          </div>

          <nav style={{ display:'flex', gap:4 }}>
            {tabs.map(({ id, label }) => (
              <a key={id} href={NAV[id]} style={{
                padding:'7px 16px', borderRadius:6, cursor:'pointer', fontFamily:'Space Grotesk, sans-serif',
                fontSize:'13px', textDecoration:'none', fontWeight: tab===id ? 600 : 400, letterSpacing:'0.03em',
                background: tab===id ? `${theme.accent}18` : 'transparent',
                color: tab===id ? theme.accent : theme.textMuted,
                borderBottom: tab===id ? `2px solid ${theme.accent}` : '2px solid transparent',
                transition:'all 0.15s', marginBottom:-1, display:'inline-block'
              }}>{label}</a>
            ))}
          </nav>

          <div style={{ marginLeft:'auto', display:'flex', gap:12 }}>
            <a href="https://github.com/jakeblackburnn/Skyrim-Alchemy" target="_blank" rel="noreferrer" style={{ color:theme.textMuted, fontSize:'12px', textDecoration:'none' }}>↗ GitHub</a>
            <a href="https://j-blackburn-portfolio.web.app/" target="_blank" rel="noreferrer" style={{ color:theme.textMuted, fontSize:'12px', textDecoration:'none' }}>J. Blackburn</a>
          </div>
        </div>
      </header>

      <main style={{ flex:1, maxWidth:1440, margin:'0 auto', width:'100%', padding:'20px 24px' }}>
        {tab === 'calculator' && <CalculatorTab theme={theme} />}
        {tab === 'datasets'   && <BrowserTab    theme={theme} />}
        {tab === 'insights'   && <InsightsTab   theme={theme} />}
      </main>

      {showTweaks && (
        <div style={{ position:'fixed', bottom:20, right:20, width:240, background:theme.surface, border:`1px solid ${theme.border}`, borderRadius:10, padding:'16px 18px', zIndex:1000, boxShadow:'0 8px 32px #00000066' }}>
          <div style={{ fontSize:'11px', fontWeight:700, color:theme.textMuted, letterSpacing:'0.1em', textTransform:'uppercase', fontFamily:'Space Grotesk', marginBottom:14 }}>Tweaks</div>
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:'11px', color:theme.text, marginBottom:8, fontFamily:'Space Grotesk' }}>Color Mode</div>
            <div style={{ display:'flex', gap:6 }}>
              {[['slate','Cool Slate'],['warm','Warm Charcoal']].map(([k,l])=>(
                <button key={k} onClick={()=>setTweak('colorMode',k)} style={{ flex:1, padding:'6px 0', fontSize:'10px', fontFamily:'Space Grotesk', borderRadius:5, background: tweaks.colorMode===k ? theme.accent : theme.surfaceAlt, color: tweaks.colorMode===k ? '#0d1117' : theme.textMuted, border:`1px solid ${tweaks.colorMode===k ? theme.accent : theme.border}`, cursor:'pointer', fontWeight:600 }}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{ marginBottom:14 }}>
            <div style={{ fontSize:'11px', color:theme.text, marginBottom:8, fontFamily:'Space Grotesk' }}>Accent</div>
            <div style={{ display:'flex', gap:6 }}>
              {['#50c9a5','#79c0ff','#a78bfa','#fb923c'].map(c=>(
                <button key={c} onClick={()=>setTweak('accentColor',c)} style={{ width:28, height:28, borderRadius:6, background:c, border: tweaks.accentColor===c ? `2px solid ${theme.text}` : '2px solid transparent', cursor:'pointer' }}/>
              ))}
            </div>
          </div>
          <div>
            <div style={{ fontSize:'11px', color:theme.text, marginBottom:8, fontFamily:'Space Grotesk' }}>Highlight</div>
            <div style={{ display:'flex', gap:6 }}>
              {['#f5c542','#f0a050','#e8e060','#c0e0a0'].map(c=>(
                <button key={c} onClick={()=>setTweak('amberColor',c)} style={{ width:28, height:28, borderRadius:6, background:c, border: tweaks.amberColor===c ? `2px solid ${theme.text}` : '2px solid transparent', cursor:'pointer' }}/>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
{% endverbatim %}
